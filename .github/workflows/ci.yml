name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-smoke:
    name: Build + smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Unit tests
        run: cargo test

      - name: Run (JIT) smoke
        run: cargo run --quiet -- run ci/smoke.hyp

      - name: File I/O smoke
        run: |
          cargo run --quiet -- compile ci/io_compile.hyp
          rm -f ci_compile_io.txt

      - name: Compiler JIT smoke
        run: cargo run --quiet -- compile ci/smoke.hyp

      - name: Compiler JSON smoke
        run: |
          cargo run --quiet -- compile ci/json_compile.hyp
          rm -f ci_json_compile.json

      - name: Compiler mmap smoke
        run: |
          cargo run --quiet -- compile ci/mmap_compile.hyp
          rm -f ci_compile_mmap.txt

      - name: Compiler input smoke
        run: |
          printf 'hello\nworld\n' | cargo run --quiet -- compile ci/input_compile.hyp

      - name: Compiler clock smoke
        run: cargo run --quiet -- compile ci/clock_compile.hyp

      - name: Compiler collection methods smoke
        run: cargo run --quiet -- compile ci/collections_compile.hyp

      - name: Compiler dict hash-map smoke
        run: cargo run --quiet -- compile ci/dict_compile.hyp

      - name: Compiler string methods smoke
        run: cargo run --quiet -- compile ci/strings_compile.hyp

      - name: Break and continue smoke
        run: cargo run --quiet -- compile ci/break_continue.hyp

      - name: Raise and handle smoke
        run: |
          cargo run --quiet -- compile ci/raise_handle.hyp > /tmp/rh_jit.txt
          cargo run --quiet -- run ci/raise_handle.hyp > /tmp/rh_run.txt
          diff /tmp/rh_run.txt /tmp/rh_jit.txt

      - name: Traits smoke
        run: cargo run --quiet -- compile ci/traits_compile.hyp

      - name: Pub and mut smoke
        run: cargo run --quiet -- compile ci/pub_mut.hyp

      - name: Ref smoke
        run: cargo run --quiet -- compile ci/ref_compile.hyp

      - name: Vectorize and parallel smoke
        run: cargo run --quiet -- compile ci/vectorize_compile.hyp

      - name: Compiler emit-exe smoke
        run: |
          cargo run --quiet -- compile ci/smoke.hyp --emit-exe /tmp/hyper_smoke
          /tmp/hyper_smoke

      - name: Compiler emit-exe collections smoke
        run: |
          cargo run --quiet -- compile ci/collections_compile.hyp --emit-exe /tmp/hyper_coll
          /tmp/hyper_coll

      - name: Compiler emit-exe dict hash-map smoke
        run: |
          cargo run --quiet -- compile ci/dict_compile.hyp --emit-exe /tmp/hyper_dict
          /tmp/hyper_dict

      - name: Compiler emit-exe strings smoke
        run: |
          cargo run --quiet -- compile ci/strings_compile.hyp --emit-exe /tmp/hyper_str
          /tmp/hyper_str

      - name: Compiler emit-exe break and continue smoke
        run: |
          cargo run --quiet -- compile ci/break_continue.hyp --emit-exe /tmp/hyper_bc
          /tmp/hyper_bc

      - name: Compiler emit-exe raise and handle smoke
        run: |
          cargo run --quiet -- compile ci/raise_handle.hyp --emit-exe /tmp/hyper_rh
          /tmp/hyper_rh > /tmp/rh_exe.txt
          diff /tmp/rh_jit.txt /tmp/rh_exe.txt

      - name: Division by zero
        run: |
          set +e
          cargo run --quiet -- run ci/divzero.hyp > /tmp/dz_run.txt 2>&1
          run_code=$?
          cargo run --quiet -- compile ci/divzero.hyp > /tmp/dz_jit.txt 2>&1
          jit_code=$?
          set -e
          test "$run_code" -eq 70
          test "$jit_code" -eq 70
          diff /tmp/dz_run.txt /tmp/dz_jit.txt

      - name: Run and compile output parity
        run: |
          cargo run --quiet -- run ci/smoke.hyp > /tmp/out_run.txt
          cargo run --quiet -- compile ci/smoke.hyp > /tmp/out_jit.txt
          /tmp/hyper_smoke > /tmp/out_exe.txt
          diff /tmp/out_run.txt /tmp/out_jit.txt
          diff /tmp/out_run.txt /tmp/out_exe.txt

      - name: Break and continue output parity
        run: |
          cargo run --quiet -- run ci/break_continue.hyp > /tmp/bc_run.txt
          cargo run --quiet -- compile ci/break_continue.hyp > /tmp/bc_jit.txt
          /tmp/hyper_bc > /tmp/bc_exe.txt
          diff /tmp/bc_run.txt /tmp/bc_jit.txt
          diff /tmp/bc_run.txt /tmp/bc_exe.txt
